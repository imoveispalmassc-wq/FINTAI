<style>
/* Layout: coluna única de celular (máx. 480px), cartões escuros, uma régua visual repetida
   (faixa de preço, força, ponto médio, faixa justa) como linguagem comum da tela. */
:root {
  color-scheme: dark;
  --bg: #0e1420; --card: #161e2e; --card2: #1b2538; --borda: #263147;
  --texto: #e8edf5; --suave: #8c99b0; --fraco: #5d6a82;
  --azul: #5b8def; --verde: #2fbf8a; --vermelho: #f06a6a; --ambar: #f2b84b; --ardosia: #4a5875;
  --claro: #e3e7ee; --tinta: #10151f;
  --display: 'Space Grotesk', system-ui, sans-serif;
  --corpo: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--texto); font-family: var(--corpo); font-size: 14px; line-height: 1.45; }
.app { max-width: 480px; margin: 0 auto; padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }

.proto { margin: 10px 0 0; padding: 6px 10px; border-radius: 8px; background: #f2b84b1f; color: var(--ambar); font-size: 11.5px; text-align: center; }

/* topo */
.topo { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; }
.topo .icone { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; flex: none; }
.topo .icone:active { background: var(--card); }
.topo .meio { flex: 1; min-width: 0; }
.topo .nome { font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.15; }
.topo .bolsa { display: inline-flex; align-items: center; gap: 6px; color: var(--suave); font-size: 12.5px; margin-top: 2px; }
.topo .bolsa svg { flex: none; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* cartão de decisão */
.decisao { background: linear-gradient(135deg, #1b2740 0%, #141c2c 70%); border: 1px solid var(--borda); border-radius: 18px; padding: 16px; }
.decisao .razao { font-weight: 600; font-size: 14.5px; }
.decisao .meta { color: var(--suave); font-size: 12px; margin-top: 2px; }
.decisao .linha { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.decisao .preco { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; }
.decisao .var { font-weight: 600; font-size: 14px; }
.decisao .after { font-size: 12px; margin-top: 6px; color: var(--vermelho); }
.badge { display: inline-block; margin-top: 14px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #ece3c4; color: var(--tinta); }
.badge.COMPRAR { background: #bfecd9; } .badge.CARO { background: #f6d99a; } .badge.VENDER { background: #f6c1c1; }
.decisao .ponto { margin-top: 10px; font-size: 14px; }
.pilula { display: inline-block; margin-top: 10px; border: 1px solid var(--borda); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--texto); }

.visao-t { font-family: var(--display); font-size: 18px; font-weight: 600; margin: 22px 0 0; }

/* gráfico */
.grafico { position: relative; margin-top: 12px; }
.grafico canvas { display: block; width: 100%; height: 280px; touch-action: pan-y; border-radius: 12px; }
.grafico.grande canvas { height: 440px; }
.grafico .expandir { position: absolute; top: 6px; left: 6px; width: 32px; height: 32px; border-radius: 9px; background: #161e2ecc; display: grid; place-items: center; color: var(--suave); }
.grafico .ia { position: absolute; top: 6px; right: 6px; padding: 6px 11px; border-radius: 999px; background: var(--claro); color: var(--tinta); font-size: 12px; font-weight: 600; }
.grafico .ia b { color: #3b6fd6; margin-right: 4px; }
.aviso { margin-top: 8px; padding: 9px 11px; border-radius: 10px; background: var(--card); border: 1px solid var(--borda); color: var(--suave); font-size: 12.5px; }
.escalas { display: flex; align-items: center; gap: 2px; margin-top: 10px; }
.escalas .e { flex: 1; padding: 7px 0; border-radius: 9px; color: var(--suave); font-size: 13px; font-weight: 500; text-align: center; }
.escalas .e[aria-pressed="true"] { background: var(--claro); color: var(--tinta); font-weight: 700; }
.escalas .vela { flex: none; width: 38px; height: 34px; margin-left: 6px; border-radius: 9px; display: grid; place-items: center; color: var(--suave); border: 1px solid var(--borda); }
.escalas .vela[aria-pressed="true"] { color: var(--texto); border-color: var(--azul); }
.legenda-var { color: var(--suave); font-size: 12px; margin-top: 8px; }
.legenda-var b { font-weight: 600; }

/* seções */
.sec { margin-top: 30px; }
.sec > h2 { font-family: var(--display); font-size: 18px; font-weight: 600; margin: 0 0 10px; text-wrap: balance; }
.sec > h2 small { font-family: var(--corpo); font-weight: 400; color: var(--suave); font-size: 12.5px; margin-left: 6px; }
.sub { color: var(--suave); font-size: 12px; margin: -6px 0 10px; }
.card { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 14px; }
.pilha { display: grid; gap: 8px; }
.rot { color: var(--suave); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
.link { color: var(--azul); font-size: 12.5px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #5b8def66; }
.nota { color: var(--suave); font-size: 12.5px; line-height: 1.5; }
.nota b { color: var(--texto); font-weight: 600; }
.tag-proto { display: inline-block; padding: 1px 7px; border-radius: 999px; border: 1px dashed var(--fraco); color: var(--suave); font-size: 10.5px; letter-spacing: .03em; vertical-align: middle; }

/* linha simples: rótulo à esquerda, valor à direita */
.zona { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--borda);
  border-left: 3px solid var(--c); border-radius: 12px; padding: 13px 14px; }
.zona b { font-size: 15.5px; font-weight: 700; text-align: right; }
.duas { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.duas .dir { font-size: 17px; font-weight: 700; text-align: right; white-space: nowrap; }
.duas .esq small { display: block; color: var(--suave); font-size: 12px; margin-top: 2px; }

/* régua */
.regua { position: relative; height: 10px; border-radius: 999px; margin: 26px 6px 8px; }
.regua .traco { position: absolute; top: -5px; width: 2px; height: 20px; transform: translateX(-1px); border-radius: 2px; background: var(--texto); }
.regua .bola { position: absolute; top: -4px; width: 18px; height: 18px; transform: translateX(-9px); border-radius: 50%; background: var(--texto);
  border: 3px solid var(--azul); box-shadow: 0 0 0 4px #5b8def33; }
.regua button.bola { cursor: pointer; }
.regua .aqui { position: absolute; top: -22px; transform: translateX(-50%); font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--azul); white-space: nowrap; }
.regua .balao { position: absolute; top: -30px; transform: translateX(-50%); background: var(--claro); color: var(--tinta); font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.pontas { display: flex; justify-content: space-between; gap: 8px; color: var(--suave); font-size: 12px; }
.pontas.tres span { flex: 1; } .pontas.tres span:nth-child(2) { text-align: center; } .pontas.tres span:nth-child(3) { text-align: right; }
.leg { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--suave); font-size: 12px; margin-top: 10px; }
.leg span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--c); }

/* bloco mín/máx */
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.trio div span { display: block; color: var(--suave); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.trio div b { font-size: 15.5px; }
.trio div:nth-child(2) { text-align: center; } .trio div:nth-child(3) { text-align: right; }
.destaque { margin-top: 10px; font-weight: 600; }
.cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cab strong { font-size: 14.5px; }

/* fundamentos */
details.acord { border: 1px solid var(--borda); border-radius: 14px; background: #121a28; }
details.acord > summary { padding: 13px 14px; font-weight: 600; cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; }
details.acord > summary::-webkit-details-marker { display: none; }
details.acord > summary::before { content: "›"; display: inline-block; color: var(--suave); font-size: 18px; line-height: 1; transition: transform .15s; }
details.acord[open] > summary::before { transform: rotate(90deg); }
details.acord > .dentro { padding: 0 12px 12px; display: grid; gap: 10px; }
.crit .topo-c { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.crit .nome { font-weight: 600; font-size: 15px; }
.st { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.st.bom { background: #2fbf8a26; color: var(--verde); } .st.ruim { background: #f06a6a26; color: var(--vermelho); }
.st.neutro { background: var(--claro); color: var(--tinta); }
.vals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 10px; }
.vals span { display: block; color: var(--suave); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; }
.vals b { font-size: 16px; }
.lista-v { margin: 12px 0 10px; display: grid; gap: 6px; }
.lista-v div { display: flex; justify-content: space-between; gap: 10px; color: var(--suave); font-size: 13px; }
.lista-v b { color: var(--texto); }
.exemplo { background: var(--card2); border-radius: 10px; padding: 10px 12px; font-weight: 600; margin-bottom: 10px; }
.crit p { margin: 0 0 10px; color: var(--suave); font-size: 13px; line-height: 1.5; }

/* indicadores */
.grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ind { text-align: left; background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 13px 14px; min-width: 0; }
.ind .v { display: block; font-size: 21px; font-weight: 700; margin: 5px 0 3px; overflow-wrap: anywhere; }
.ind .s { display: block; color: var(--suave); font-size: 12px; }
.ind .dica { display: none; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--borda); color: var(--texto); font-size: 12.5px; line-height: 1.45; }
.ind[aria-expanded="true"] { border-color: var(--azul); } .ind[aria-expanded="true"] .dica { display: block; }

/* retorno */
.toggle { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--borda); border-radius: 999px; padding: 4px; }
.toggle button { flex: 1; padding: 9px 4px; border-radius: 999px; color: var(--suave); font-size: 11.5px; white-space: nowrap; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.toggle button::after { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid currentColor; flex: none; }
.toggle button[aria-pressed="true"] { background: var(--claro); color: var(--tinta); }
.toggle button[aria-pressed="true"]::after { background: var(--verde); border-color: var(--verde); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; margin-top: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--borda); color: var(--suave); font-size: 12.5px; font-weight: 600; }
.chips button[aria-pressed="true"] { background: var(--claro); color: var(--tinta); border-color: var(--claro); }
.barras { position: relative; height: 230px; margin: 16px 0 0 44px; }
.barras .grade-y { position: absolute; inset: 0 0 24px 0; }
.barras .grade-y div { position: absolute; left: 0; right: 0; border-top: 1px solid #26314799; }
.barras .grade-y span { position: absolute; left: -44px; width: 38px; text-align: right; transform: translateY(-50%); color: var(--suave); font-size: 11px; }
.barras .cols { position: absolute; inset: 0 0 24px 0; display: flex; }
.barras .col { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 6px; position: relative; }
.barras .b { width: 34%; max-width: 46px; min-height: 3px; border-radius: 5px 5px 0 0; position: relative; transition: height .45s cubic-bezier(.2,.8,.2,1); }
.barras .b.acao { background: var(--verde); } .barras .b.idx { background: var(--ardosia); }
.barras .b i { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11.5px; font-weight: 600; white-space: nowrap; padding-bottom: 3px; }
.barras .b.idx i { color: var(--suave); font-weight: 500; }
.barras .col em { position: absolute; top: 100%; font-style: normal; color: var(--suave); font-size: 12px; padding-top: 5px; }
.resumo > div { padding: 12px 0; border-bottom: 1px solid #26314799; font-size: 13px; line-height: 1.55; color: var(--suave); }
.resumo > div:first-child { padding-top: 0; } .resumo > div:last-child { border-bottom: 0; padding-bottom: 0; }
.resumo b { color: var(--texto); font-weight: 600; } .resumo .dif { color: var(--verde); font-weight: 700; }
.resumo .dif.neg { color: var(--vermelho); }
.q { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--suave); color: var(--suave); font-size: 11px; font-weight: 700; margin-left: 4px; vertical-align: 1px; }
.dica-q { display: block; margin-top: 6px; padding: 8px 10px; border-radius: 9px; background: var(--card2); color: var(--texto); font-size: 12.5px; }

/* backtest */
.selo { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.selo.ok { background: #15402f; color: #7ee2b8; } .selo.nao { background: #4a2020; color: #ffaaaa; }
.bt p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.5; } .bt p:last-child { margin: 0; color: var(--suave); }

/* folha (modal) */
.fundo { position: fixed; inset: 0; background: #05080fb3; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.folha { width: 100%; max-width: 480px; max-height: 82%; overflow-y: auto; background: var(--card2); border: 1px solid var(--borda); border-bottom: 0;
  border-radius: 20px 20px 0 0; padding: 18px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
.folha .cab { align-items: center; margin-bottom: 10px; }
.folha h3 { font-family: var(--display); font-size: 17px; margin: 0; }
.folha .x { width: 34px; height: 34px; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: var(--suave); font-size: 18px; flex: none; }
.folha p, .folha li { color: var(--suave); font-size: 13.5px; line-height: 1.55; }
.folha p { margin: 0 0 10px; } .folha ul { margin: 0 0 10px; padding-left: 18px; }
.folha b { color: var(--texto); }
.folha code { display: block; background: var(--bg); border-radius: 9px; padding: 9px 11px; margin: 6px 0 12px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12.5px; color: var(--texto); overflow-x: auto; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

}

function TrendStrength(el, { ticker }) {
  const d = DADOS[ticker], dist = (d.preco / d.mm200 - 1) * 100;

  el.innerHTML = `<h2>Tendência e força</h2>
    <div class="pilha">
      <div class="card duas"><div class="esq"><span class="rot">Tendência</span><small>média de 200 dias</small></div><div class="dir" style="color:${corT}">${d.tendencia}</div></div>
      <div class="card duas"><div class="esq"><span class="rot">Média de 200 dias</span><small class="num">preço ${sinal(dist)} da média</small></div><div class="dir num">${din(d, d.mm200)}</div></div>
      <div class="card">
        <div class="cab"><div><strong>Força</strong><div class="nota">Últimos 14 dias</div></div><button class="link" data-folha="forca">Ver como calculamos</button></div>

          <span class="balao num" id="fbalao" style="left:${d.forca}%" hidden>${d.forca}</span>

        </div>

        <div class="destaque">${leitura}</div>

    </div>`;
  $('fbola').addEventListener('click', e => { const b = $('fbalao'); b.hidden = !b.hidden; e.currentTarget.setAttribute('aria-expanded', !b.hidden); });
  FOLHAS.forca = () => ['Como calculamos a força', `
    <p>A força é o <b>IFR (RSI) de 14 dias</b>: compara o tamanho das altas com o das quedas nos últimos 14 pregões, numa escala de 0 a 100.</p>
    <ul><li><b>Até 30:</b> sobrevendida (muita venda).</li><li><b>De 30 a 70:</b> neutra (equilíbrio).</li><li><b>Acima de 70:</b> sobrecomprada (muita compra).</li></ul>
    <code>IFR = 100 − 100 ÷ (1 + média das altas ÷ média das quedas)</code>
    <p>Valor de hoje: <b>${d.forca}</b>.</p>${fonteHtml(d)}`];
}

function MinMaxMidpoint(el, { ticker }) {
  const d = DADOS[ticker];
  const bloco = (id, titulo, min, max, periodo) => {
    if (min == null || max == null) return `<div class="card"><strong>${titulo}</strong><div class="nota" style="margin-top:6px">Dados indisponíveis</div></div>`;
    const meio = Math.floor((min + max) / 2 * 100 + 1e-6) / 100, dif = d.preco - meio, p = posicaoNaFaixa(d.preco, min, max);
    FOLHAS[id] = () => [`Ponto médio · ${titulo.toLowerCase()}`, `
      <p>O ponto médio é a metade do caminho entre a mínima e a máxima reais do período.</p>
      <code>(${f(min)} + ${f(max)}) ÷ 2 = ${f(meio)}</code>
      <p>Preço agora: <b>${din(d, d.preco)}</b>, ou <b>${din(d, Math.abs(dif))} ${dif >= 0 ? 'acima' : 'abaixo'}</b> do ponto médio.</p>${fonteHtml(d)}`];
    return `<div class="card">
      <div class="cab"><strong>${titulo}</strong><button class="link" data-folha="${id}">Ver como calculamos</button></div>
      <div class="trio num"><div><span>Mín.</span><b>${f(min)}</b></div><div><span>Máx.</span><b>${f(max)}</b></div><div><span>Agora</span><b>${f(d.preco)}</b></div></div>
      <div class="nota num" style="margin-top:8px">Ponto médio: <b>${f(meio)}</b></div>
      <div class="regua" style="background:var(--ardosia);margin-top:18px"><span class="traco" style="left:50%"></span><span class="bola" style="left:${p}%"></span></div>
      <div class="leg"><span style="--c:var(--azul)">Preço atual</span><span style="--c:var(--texto)">Ponto médio</span></div>
      <div class="destaque num">Você está ${din(d, Math.abs(dif))} ${dif >= 0 ? 'acima' : 'abaixo'} do ponto médio</div>
      <div class="nota">Preço na metade mais ${dif >= 0 ? 'cara' : 'barata'} do range de ${periodo}</div>
    </div>`;
  };
  el.innerHTML = `<h2>Mínimo, máximo e ponto médio</h2><div class="sub">Valores em ${d.moeda}</div>
    <div class="pilha">${bloco('mm12', 'Últimos 12 meses', d.min52, d.max52, '12 meses')}${bloco('mm30', 'Últimos 30 dias', d.min30, d.max30, '30 dias')}</div>`;
}

function Fundamentals(el, { ticker }) {
  const d = DADOS[ticker], dy = d.dividendo / d.preco * 100;
  const difPL = (d.pl / d.plMedio12 - 1) * 100, difLPA = (d.lpa / d.lpa12Atras - 1) * 100;
  const selo = (dif, menorMelhor) => Math.abs(dif) < 5 ? ['neutro', '⚠️ Neutro'] : ((dif < 0) === menorMelhor ? ['bom', '✅ Favorável'] : ['ruim', '❌ Desfavorável']);
  const [cPL, tPL] = selo(difPL, true), [cL, tL] = selo(difLPA, false);
  const naoPagadora = dy < 0.5;
  const [cD, tD] = naoPagadora ? ['neutro', 'Não é pagadora de dividendos'] : selo(d.dyDiferenca, false);
  const frasePL = difPL < -5 ? 'A ação está mais barata em relação ao lucro do que na média do último ano.'
    : difPL > 5 ? 'A ação está mais cara em relação ao lucro do que na média do último ano.' : 'O preço em relação ao lucro está perto da média do último ano.';
  el.innerHTML = `<h2>Fundamentos</h2>
    <details class="acord" open><summary>Fundamentos: os 3 critérios, um a um</summary><div class="dentro">
      <div class="card crit">
        <div class="topo-c"><span class="nome">Preço vs Lucro (P/L)</span><span class="st ${cPL}">${tPL}</span></div>
        <div class="vals num"><div><span>Atual</span><b>${f(d.pl)}</b></div><div><span>Média 12m</span><b>${f(d.plMedio12)}</b></div><div><span>Diferença</span><b style="color:${difPL < 0 ? 'var(--verde)' : 'var(--vermelho)'}">${sinal(difPL)}</b></div></div>
        <p>Você paga ${din(d, d.pl)} para cada ${d.moeda} 1 de lucro que a empresa gera. Há 12 meses, pagava ${din(d, d.plMedio12)}. ${frasePL}</p>
        <button class="link" data-folha="f-pl">Ver como calculamos</button>
      </div>
      <div class="card crit">
        <div class="topo-c"><span class="nome">Dividendos</span><span class="st ${cD}">${tD}</span></div>
        <div class="lista-v num">
          <div>Dividendo por ação / ano<b>${din(d, d.dividendo)}</b></div>
          <div>DY atual<b>${f(dy)}%</b></div>
          <div>DY média 12m<b>${f(d.dyMedio12)}%</b></div>
          <div>Diferença<b>${sinal(d.dyDiferenca, 0)}</b></div>
        </div>
        <div class="exemplo num">Se você investir ${d.moeda} 10.000 hoje, recebe ${din(d, 10000 * d.dividendo / d.preco)} por ano de dividendo.</div>
        <p>${naoPagadora
          ? `A ${d.ticker} quase não paga dividendo. Ela pega quase todo o lucro e reinveste na própria empresa, em fábricas e chips de IA. Não é um problema, é o perfil da empresa. Ela é para quem busca crescimento, não renda.`
          : 'O rendimento dos dividendos é comparado com a média do último ano.'}</p>
        <button class="link" data-folha="f-dy">Ver como calculamos</button>
      </div>
      <div class="card crit">
        <div class="topo-c"><span class="nome">Crescimento de Lucro (LPA)</span><span class="st ${cL}">${tL}</span></div>
        <div class="vals num"><div><span>Atual</span><b>${din(d, d.lpa)}</b></div><div><span>12m atrás</span><b>${din(d, d.lpa12Atras)}</b></div><div><span>Diferença</span><b style="color:${cor(difLPA)}">${sinal(difLPA, 0)}</b></div></div>
        <p>O lucro por ação ${difLPA >= 0 ? 'cresceu' : 'caiu'} de ${din(d, d.lpa12Atras)} para ${din(d, d.lpa)} em relação a 12 meses atrás. Base: últimos 4 trimestres.</p>
        <button class="link" data-folha="f-lpa">Ver como calculamos</button>
      </div>
    </div></details>`;
  FOLHAS['f-pl'] = () => ['Preço vs Lucro (P/L)', `<p>P/L = Preço ÷ Lucro por ação.</p><code>${f(d.preco)} ÷ ${f(d.lpa)} = ${f(d.pl)}</code>
    <p>Diferença para a média de 12 meses:</p><code>(${f(d.pl)} − ${f(d.plMedio12)}) ÷ ${f(d.plMedio12)} = ${sinal(difPL)}</code>${fonteHtml(d)}`];
  FOLHAS['f-dy'] = () => ['Dividendos (DY)', `<p>DY = Dividendo anual por ação ÷ Preço atual.</p><code>${f(d.dividendo)} ÷ ${f(d.preco)} = ${f(dy)}%</code>
    <p>Em ${d.moeda} 10.000 investidos:</p><code>10.000 × ${f(d.dividendo)} ÷ ${f(d.preco)} = ${din(d, 10000 * d.dividendo / d.preco)} por ano</code>
    <p>Com DY abaixo de 0,5% a empresa é tratada como não pagadora de dividendos, e o critério não conta contra ela.</p>${fonteHtml(d)}`];
  FOLHAS['f-lpa'] = () => ['Crescimento de Lucro (LPA)', `<p>LPA = Lucro líquido ÷ Número de ações.</p><code>Lucro ÷ ${f(d.acoes / 1e9)} bi = ${f(d.lpa)}</code>
    <p>Crescimento em 12 meses:</p><code>(${f(d.lpa)} − ${f(d.lpa12Atras)}) ÷ ${f(d.lpa12Atras)} = ${sinal(difLPA, 0)}</code>${fonteHtml(d)}`];
}

function FairPrice(el, { ticker }) {
  const d = DADOS[ticker], dy = d.dividendo / d.preco * 100;
  const piso = Math.min(d.graham, d.justoPL), teto = Math.max(d.graham, d.justoPL), divergem = teto / piso > 2;
  const a = piso * 0.6, b = teto * 1.12, pos = v => (v - a) / (b - a) * 100;
  const dentro = d.preco >= piso && d.preco <= teto, pertoPiso = d.preco - piso < teto - d.preco;
  const ondeEsta = dentro ? `está dentro dessa faixa, mas mais perto do ${pertoPiso ? 'piso' : 'teto'}` : d.preco < piso ? 'está abaixo dessa faixa' : 'está acima dessa faixa';
  const t0 = v => f(Math.round(v), 0);
  el.innerHTML = `<h2>Preço justo <small>referência</small></h2>
    <div class="pilha">
      <div class="card">
        <span class="rot">Faixa justa estimada</span>
        <div class="num" style="font-size:22px;font-weight:700;margin-top:4px">${d.moeda} ${t0(piso)} a ${d.moeda} ${t0(teto)}</div>
        <div class="regua" style="background:var(--ardosia);margin-top:22px">
          <span class="traco" style="left:${pos(d.graham)}%"></span><span class="traco" style="left:${pos(d.justoPL)}%"></span><span class="bola" style="left:${pos(d.preco)}%"></span>
        </div>
        <div class="pontas tres num"><span>Graham ${t0(d.graham)}</span><span>Preço ${t0(d.preco)}</span><span>P/L hist. ${t0(d.justoPL)}</span></div>
        <p class="nota" style="margin:12px 0 10px">Pelo Graham, o justo seria ${d.moeda} ${t0(d.graham)}. Pelo P/L histórico, ${d.moeda} ${t0(d.justoPL)}. O preço atual de ${d.moeda} ${t0(d.preco)} ${ondeEsta}.</p>
        <button class="link" data-folha="justo">Ver como calculamos</button>
      </div>
      <div class="card">
        <span class="st neutro">${divergem ? 'Sem preço justo confiável' : 'Faixa justa consistente'}</span>
        <p class="nota" style="margin:10px 0 0">${divergem
          ? `Os métodos divergem demais (de ${d.moeda} ${t0(piso)} a ${d.moeda} ${t0(teto)}). Por isso, o Fintai não usa preço justo como decisão. Usamos faixa de preço, tendência e fundamentos.`
          : 'Os métodos apontam para valores próximos, então a faixa serve como referência.'}</p>
      </div>
      <details class="acord"><summary>Ver todos os métodos</summary><div class="dentro">
        <div class="card"><span class="rot">Preço-Teto Bazin · Não se aplica</span>
          <p class="nota" style="margin:8px 0 10px">${dy < 0.5
            ? `A ${d.ticker} quase não paga dividendo, então o preço-teto Bazin de ${din(d, d.bazin)} não é uma referência válida. Ignoramos esse método para essa ação.`
            : `Preço-teto Bazin: ${din(d, d.bazin)}.`}</p>
          <div class="nota num" style="margin:0 0 10px">Dividendo médio 5 anos ${f(d.divMedio5)} / 6% = ${f(d.bazin)}</div>
          <button class="link" data-folha="bazin">Ver como calculamos</button></div>
      </div></details>
    </div>`;
  FOLHAS.justo = () => ['Faixa justa estimada', `
    <p><b>Graham</b></p><code>√(22,5 × LPA ${f(d.lpa)} × VPA ${f(d.vpa)}) = ${f(d.graham)}</code>
    <p><b>P/L histórico</b></p><code>P/L médio histórico ${f(d.plHistorico)} × LPA ${f(d.lpa)} = ${f(d.justoPL)}</code>
    <p>O P/L médio histórico (${f(d.plHistorico)}) cobre vários anos; não é o P/L médio de 12 meses (${f(d.plMedio12)}).</p>
    <p>Quando um método dá mais que o dobro do outro, mostramos a faixa e não um número único.</p>${fonteHtml(d)}`];
  FOLHAS.bazin = () => ['Preço-Teto Bazin', `
    <code>Dividendo médio 5 anos ${f(d.divMedio5)} ÷ 6% = ${f(d.bazin)}</code>
    <p>O <b>${din(d, d.divMedio5)}</b> é a <b>média de 5 anos, não o anual</b>. O dividendo anual atual é <b>${din(d, d.dividendo)}</b>.</p>
    <p>O método foi feito para empresas que distribuem boa parte do lucro. Com dividendo tão baixo ele quebra: o preço atual fica muito acima do teto, sem que isso diga algo sobre a empresa.</p>${fonteHtml(d)}`];
}

function Indicators(el, { ticker }) {
  const d = DADOS[ticker], dy = d.dividendo / d.preco * 100, difPL = (d.pl / d.plMedio12 - 1) * 100, bi = f(d.acoes / 1e9);
  const por10k = din(d, 10000 * d.dividendo / d.preco);
  const cartoes = [
    ['P/L atual', f(d.pl), `${sinal(difPL)} vs. média de 12m`, `Você paga ${din(d, d.pl)} para cada ${d.moeda} 1 de lucro. Conta: ${f(d.preco)} / ${f(d.lpa)} = ${f(d.pl)}`],
    ['P/L médio 12 meses', f(d.plMedio12), 'com o LPA de cada trimestre', 'Média do P/L dos últimos 4 trimestres.'],
    ['LPA básico', din(d, d.lpa), 'últimos 12 meses', `Lucro por ação. Cada ação ganhou ${din(d, d.lpa)} em 12 meses. Conta: Lucro / ${bi} bi de ações`],
    ['Dividendo anual', din(d, d.dividendo), 'pago em 12 meses', `O que pingou na sua conta por ação em 12 meses. Se investir ${d.moeda} 10.000, recebe ${por10k} / ano.`],
    ['Dividend yield', `${f(dy)}%`, `${f(d.dividendo)} / ${f(d.preco)}`, `Quanto o dividendo representa sobre o preço. ${f(d.dividendo)} / ${f(d.preco)} = ${f(dy)}%. É baixo porque a ${d.ticker} reinveste o lucro, não porque está com problema.`],
    ['Ações em circulação', `${bi} bi`, 'quantos pedaços a empresa foi dividida', `A ${d.ticker} foi fatiada em ${bi} bilhão de ações.`],
  ];
  el.innerHTML = `<h2>Indicadores</h2>
    <div class="sub">Dados de ${d.data} · Fonte: ${d.fonte} · <button class="link" data-folha="ind">Ver como calculamos</button></div>
    <div class="grade2">${cartoes.map(([r, v, s, dica]) => `<button class="ind" aria-expanded="false"><span class="rot">${r}</span><span class="v num">${v}</span><span class="s num">${s}</span><span class="dica">${dica}</span></button>`).join('')}</div>`;
  el.querySelectorAll('.ind').forEach(b => b.addEventListener('click', () => {
    const abrir = b.getAttribute('aria-expanded') !== 'true';
    el.querySelectorAll('.ind').forEach(o => o.setAttribute('aria-expanded', 'false')); b.setAttribute('aria-expanded', abrir);
  }));
  FOLHAS.ind = () => ['Como calculamos os indicadores', `
    <p><b>P/L atual</b></p><code>${f(d.preco)} ÷ ${f(d.lpa)} = ${f(d.pl)}</code>
    <p><b>Dividend yield</b></p><code>${f(d.dividendo)} ÷ ${f(d.preco)} = ${f(dy)}%</code>
    <p><b>LPA básico</b></p><code>Lucro líquido de 12 meses ÷ ${bi} bi de ações = ${f(d.lpa)}</code>
    <p><b>P/L médio 12 meses:</b> média do P/L dos últimos 4 trimestres, cada um com o LPA divulgado na época.</p>
    <p>Toque em um cartão para ver a explicação dele.</p>${fonteHtml(d)}`];
}

function TotalReturn(el, { ticker, dividendReinvest = true, benchmark }) {
  const d = DADOS[ticker], dy = d.dividendo / d.preco * 100;
  let reinveste = dividendReinvest, comp = benchmark || d.comparadorPadrao, dicaAberta = false;
  const virou = (moeda, v) => `${moeda} ${f(Math.round(10000 * (1 + v / 100) / 10) * 10, 0)}`;
  function render() {
    const c = d.comparadores[comp], vals = reinveste ? d.retorno.total : d.retorno.preco;
    const fmtAcao = v => (reinveste ? sinal(v, 0) : sinal(v, 1)), teto = 1000;
    const texto = dy < 0.5
      ? (reinveste ? `Quase nenhuma diferença. A ${d.ticker} paga só ${din(d, d.dividendo)} por ação / ano. Reinvestir ou não, muda menos de 0,2% no seu retorno em 5 anos.`
                   : `Você recebeu ${din(d, d.divMedio5 * 5)} em 5 anos por ação em dividendos, em dinheiro, e não recomprou.`)
      : (reinveste ? `Grande diferença. Reinvestir os dividendos faz seu retorno subir de ${sinal(d.retorno.preco[2], 0)} para ${sinal(d.retorno.total[2], 0)} em 5 anos, porque você compra mais ações com o dividendo.`
                   : 'Você recebeu o dividendo em dinheiro e não recomprou. Perdeu o efeito bola de neve.');
    const outraMoeda = c.moeda !== d.moeda;
    const linhas = d.retorno.periodos.map((p, i) => {
      if (c.v[i] == null) return `<div><b>Retorno acumulado: ${fmtAcao(vals[i])} em ${p}</b><br>${c.nome}: Dados indisponíveis</div>`;
      const dif = vals[i] - c.v[i], casas = Number.isInteger(Math.round(dif * 10) / 10) ? 0 : 1;
      return `<div><b>Retorno acumulado: ${fmtAcao(vals[i])} em ${p}</b>${reinveste ? '' : ' (só preço, exemplo)'}<br>
        ${c.nome}: ${pctFlex(c.v[i])} em ${p} | Diferença: <span class="dif ${dif < 0 ? 'neg' : ''}">${dif >= 0 ? '+' : '-'}${f(Math.abs(dif), casas)} pontos ${dif >= 0 ? 'acima' : 'abaixo'} ${c.artigo}</span>${i === 0 ? '<button class="q" id="qpp" aria-label="O que são pontos percentuais?">?</button>' : ''}
        ${i === 0 && dicaAberta ? `<span class="dica-q">p.p. = pontos percentuais. É só a conta: ${f(vals[0], reinveste ? 0 : 1)}% - ${f(c.v[0], Number.isInteger(c.v[0]) ? 0 : 1)}% = ${f(Math.abs(dif), casas)} pontos. Não é ${f(Math.abs(dif), casas)}%.</span>` : ''}<br>
        Se você tivesse investido ${c.moeda} 10.000: ${d.ticker}${outraMoeda ? ` (em ${d.moeda})` : ''} virou ${virou(d.moeda, vals[i])} | ${c.curto} virou ${virou(c.moeda, c.v[i])}</div>`;
    }).join('');
    el.innerHTML = `<h2>Retorno acumulado</h2><div class="sub">com dividendos, comparado ao índice</div>
      <div class="toggle" role="group" aria-label="Reinvestimento de dividendos">
        <button data-r="1" aria-pressed="${reinveste}">Reinvestindo dividendos</button><button data-r="0" aria-pressed="${!reinveste}">Sem reinvestir</button>
      </div>
      <p class="nota" style="margin:10px 2px 0">${texto}</p>
      <div class="chips" role="group" aria-label="Comparador">${Object.entries(d.comparadores).map(([k, o]) => `<button data-c="${k}" aria-pressed="${k === comp}">${o.nome}</button>`).join('')}</div>
      <div class="barras">
        <div class="grade-y">${[0, 200, 400, 600, 800, 1000].map(v => `<div style="bottom:${v / teto * 100}%"><span>${v}%</span></div>`).join('')}</div>
        <div class="cols">${d.retorno.periodos.map((p, i) => `<div class="col">
          <div class="b acao" style="height:${Math.min(100, vals[i] / teto * 100)}%"><i class="num">${fmtAcao(vals[i])}</i></div>
          <div class="b idx" style="height:${c.v[i] == null ? 0 : Math.min(100, Math.max(0, c.v[i]) / teto * 100)}%"><i class="num">${c.v[i] == null ? '—' : pctFlex(c.v[i])}</i></div>
          <em>${p}</em></div>`).join('')}</div>
      </div>
      <div class="leg" style="margin:8px 0 12px"><span style="--c:var(--verde)">${d.ticker}</span><span style="--c:var(--ardosia)">${c.nome}</span></div>
      ${outraMoeda ? `<div class="aviso" style="margin-bottom:10px">Comparação com ${c.nome} é em moedas diferentes. Para comparar certo, converta o dólar ou use o comparador S&amp;P 500.</div>` : ''}
      <div class="card resumo num">${linhas}</div>
      <p class="nota" style="margin:12px 2px 0">Por que 3 anos (${sinal(d.retorno.total[1], 0)}) rendeu mais que 5 anos (${sinal(d.retorno.total[2], 0)})? Porque de 5 anos atrás até 3 anos atrás, a ${d.ticker} ficou quase parada. Todo o foguete foi nos últimos 3 anos, com a IA. Retorno passado não garante retorno futuro.</p>
      <p class="nota" style="margin:8px 2px 0">Dados até ${d.data} · <button class="link" data-folha="retorno">Ver como calculamos</button></p>`;
    el.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { reinveste = b.dataset.r === '1'; render(); }));
    el.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { comp = b.dataset.c; render(); const a = el.querySelector(`[data-c="${comp}"]`); a && a.scrollIntoView({ block: 'nearest', inline: 'center' }); }));
    const q = $('qpp'); q && q.addEventListener('click', () => { dicaAberta = !dicaAberta; render(); });
  }
  FOLHAS.retorno = () => ['Retorno acumulado', `
    <p><b>Reinvestindo dividendos (Total Return)</b></p><code>(Preço final + Dividendos reinvestidos) ÷ Preço inicial − 1</code>
    <p><b>Sem reinvestir (Price Return)</b></p><code>Preço final ÷ Preço inicial − 1</code>
    <p><b>Conta de 1 ano</b></p><code>Retorno total com dividendos: (${f(d.preco)} + ${f(d.dividendo)}) / ${f(d.preco1AnoAtras)} - 1 = ${f(((d.preco + d.dividendo) / d.preco1AnoAtras - 1) * 100)}% = ${f(d.retorno.total[0], 0)}% arredondado</code>
    <p>Preço em ${d.data1AnoAtras}: <b>${din(d, d.preco1AnoAtras)}</b>. Preço em ${d.data}: <b>${din(d, d.preco)}</b>. Diferença de ${f(d.dividendo / d.preco1AnoAtras * 100)} ponto vs o gráfico é o dividendo de ${din(d, d.dividendo)}.</p>
    <p>Os retornos de "Sem reinvestir" neste protótipo são exemplos.</p>
    <p>A barra verde usa o primeiro cálculo quando o reinvestimento está ligado e o segundo quando está desligado. Os dois ficam sempre disponíveis.</p>
    <p><b>Diferença em pontos:</b> retorno da ação menos retorno do comparador.</p>
    <p>Comparadores brasileiros (Ibovespa, CDI, Selic, IPCA, Poupança) estão em reais e não são convertidos.</p>${fonteHtml(d)}`];
  render();
}

function Backtest(el, { ticker, windowYears = 5 }) {
  const d = DADOS[ticker], z = zonas(d);
  function render(expandido) {
    const b = d.backtest[expandido ? 'max' : '5a'], ref = b.referencia;
    const okC = seloBacktest('compra', b.oportunidade, ref), okV = seloBacktest('venda', b.cara, ref);
    const virou = v => `${d.moeda} ${f(10000 * (1 + v / 100), 0)}`;
    const selo = ok => `<span class="selo ${ok ? 'ok' : 'nao'}">${ok ? 'SINAL VALIDADO ✅' : 'SINAL INVALIDADO ❌'}</span>`;
    const cols = (s, rot) => `<div class="vals num"><div><span>Vezes</span><b>${s.vezes}</b></div><div><span>Retorno 12m</span><b>${sinal(s.retorno, 0)}</b></div><div><span>${rot}</span><b>${s.acerto}%</b></div></div>`;
    const conclusaoC = okC
      ? (ref ? `Comprar na Zona de Oportunidade deu ${f(b.oportunidade.retorno / ref.retorno, 1)}x mais retorno que comprar em uma semana qualquer.`
             : `Comprar na Zona de Oportunidade rendeu em média ${sinal(b.oportunidade.retorno, 0)} em 12 meses.`)
      : `Comprar na Zona de Oportunidade não rendeu mais do que comprar em uma semana qualquer. NÃO use esse sinal para comprar ${d.ticker}.`;
    const conclusaoV = okV
      ? `Depois de entrar na Zona Cara, a ação caiu em ${b.cara.acerto}% das vezes. Vender aqui evitou perdas.`
      : `Quem vendeu porque estava na Zona Cara, perdeu alta. NÃO use esse sinal para vender ${d.ticker}.`;
    const dinheiroV = okV
      ? `${d.moeda} 10.000 virava ${virou(b.cara.retorno)} em média em 12 meses para quem ficou.`
      : `Quem comprou mesmo na Zona Cara, ainda ganhou em média ${sinal(b.cara.retorno, 0)} em 12 meses. Vender aqui não evitou queda.`;
    el.innerHTML = `<h2>Os sinais funcionaram no passado? <small>${expandido ? 'teste com todo o histórico' : `teste com até ${windowYears} anos de histórico`}</small></h2>
      ${expandido ? '<div class="aviso" style="margin-bottom:10px">Backtest expandido para todo o histórico</div>' : ''}
      <div class="pilha">
        <div class="card bt">
          <div class="cab"><strong>Comprar na Zona de Oportunidade</strong>${selo(okC)}</div>
          ${cols(b.oportunidade, 'Subiu em')}
          <p>${conclusaoC}</p>
          <p>${d.moeda} 10.000 virava ${virou(b.oportunidade.retorno)} em média em 12 meses, quando comprava na Zona de Oportunidade.</p>
        </div>
        <div class="card bt">
          <div class="cab"><strong>Preço na Zona Cara</strong>${selo(okV)}</div>
          ${cols(b.cara, 'Caiu em')}
          <p>${conclusaoV}</p>
          <p>${dinheiroV}</p>
        </div>
      </div>
      <p class="nota" style="margin:12px 2px">${ref
        ? `<b>Referência:</b> comprar em uma semana qualquer rendeu em média ${sinal(ref.retorno, 0)} em 12 meses (subiu em ${ref.subiu}% das vezes) nos últimos ${windowYears} anos. Teste com ${f(b.anos, 1)} anos de histórico, semana a semana, usando só os dados disponíveis em cada data. Retornos com dividendos. Resultado passado não garante resultado futuro.`
        : '<b>Referência:</b> dados indisponíveis para todo o histórico neste protótipo. Resultado passado não garante resultado futuro.'}
        <span class="tag-proto">números de protótipo</span></p>
      <details class="acord"><summary>Como os números são calculados</summary><div class="dentro">
        <div class="nota">
          <p style="margin:0 0 8px"><b>Janela:</b> ${expandido ? 'todo o histórico disponível' : `últimos ${windowYears} anos`}, semana a semana.</p>
          <p style="margin:0 0 8px"><b>Zona de Oportunidade</b> = até ${din(d, z.oportunidade)} hoje (faixa inferior das 52 semanas). <b>Zona Cara</b> = acima de ${din(d, z.cara)} hoje (faixa superior). Em cada semana do passado, as faixas são recalculadas só com os dados que existiam até aquela data, sem olhar o futuro.</p>
          <p style="margin:0 0 8px"><b>Retorno 12M</b> = (valor 12 meses depois, com dividendos reinvestidos) ÷ (valor na semana do sinal) − 1.</p>
          <p style="margin:0 0 8px"><b>Sinal validado:</b> acertou em mais de 60% das vezes e rendeu melhor do que a referência (comprar em uma semana qualquer).</p>
          <p style="margin:0">Um sinal invalidado nunca entra na decisão do topo da tela.</p>
        </div>
      </div></details>`;
  }
  render(false);
  return { expandir: render };
}

/* ------------------------------------------------------------ montagem da tela */
const TICKER = 'MU';
DecisionCard($('decisao'), { ticker: TICKER });
const backtest = Backtest($('backtest'), { ticker: TICKER, windowYears: 5 });
StockChart($('grafico'), { ticker: TICKER, aoTrocarEscala: k => backtest.expandir(k === 'max') });
PriceRange($('faixa'), { ticker: TICKER });
TrendStrength($('tendencia'), { ticker: TICKER });
MinMaxMidpoint($('minmax'), { ticker: TICKER });
Fundamentals($('fundamentos'), { ticker: TICKER });
FairPrice($('justo'), { ticker: TICKER });
Indicators($('indicadores'), { ticker: TICKER });
TotalReturn($('retorno'), { ticker: TICKER, dividendReinvest: true, benchmark: 'sp500' });

$('fav').addEventListener('click', e => {
  const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on); b.querySelector('svg').style.fill = on ? '#f2c94c' : 'none';
});
</script>
</body>
