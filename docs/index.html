<style>
/* Layout: coluna única de celular (máx. 480px), cartões escuros, uma régua visual repetida
   (faixa de preço, força, ponto médio, faixa justa) como linguagem comum da tela. */
:root {
  display: block; color-scheme: dark;
  --bg: #0e1420; --card: #161e2e; --card2: #1b2538; --borda: #263147;
  --texto: #e8edf5; --suave: #8c99b0; --fraco: #5d6a82;
  --azul: #5b8def; --verde: #2fbf8a; --verde-claro: #8fe3c4; --verde-forte: #16805c; --vermelho: #f06a6a; --ambar: #f2b84b; --ardosia: #4a5875;
  --claro: #e3e7ee; --tinta: #10151f;
  --display: 'Space Grotesk', system-ui, sans-serif;
  --corpo: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
.app { background: var(--bg); color: var(--texto); font-family: var(--corpo); font-size: 14px; line-height: 1.45; }
.app { max-width: 480px; margin: 0 auto; padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }

.proto { margin: 10px 0 0; padding: 6px 10px; border-radius: 8px; background: #f2b84b1f; color: var(--ambar); font-size: 11.5px; text-align: center; }

/* topo: fixo (sticky) no alto da viewport ao rolar, pra nunca perder de vista qual ativo está
   sendo olhado - nome + preço (o badge/decisão continua só na posição normal, mais abaixo) */
.topo { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px;
  position: sticky; top: 0; z-index: 20; background: var(--bg); }
.topo .icone { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; flex: none; }
.topo .icone:active { background: var(--card); }
.topo .meio { flex: 1; min-width: 0; }
.topo .nome { font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.15; }
.topo .bolsa { display: inline-flex; align-items: center; gap: 6px; color: var(--suave); font-size: 12.5px; margin-top: 2px; }
.topo .bolsa svg { flex: none; }
/* Preço e variação do topo só aparecem rolando (junto do ticker) - no estado normal ficariam
   duplicados com o preço/variação que já aparecem no cartão de decisão logo abaixo. */
.topo .preco-topo { display: none; font-family: var(--display); font-size: 17px; font-weight: 700; flex: none; margin-left: 4px; }
.topo .var-topo { display: none; font-size: 13px; font-weight: 700; flex: none; }
/* Ao rolar (.rolou): esconde nome completo/bolsa, mostra só o ticker + cotação + variação do dia. */
.topo .ticker-topo { display: none; font-family: var(--display); font-size: 19px; font-weight: 700; }
.topo.rolou .meio { display: none; }
.topo.rolou .preco-topo, .topo.rolou .var-topo { display: block; }
.topo.rolou .ticker-topo { display: block; }
/* Afasta mais a cotação do ticker no estado rolado (pedido do usuário) - no estado normal o espaço
   já é maior porque .meio ocupa o resto da largura (flex: 1), então aqui só o gap entre ticker/
   cotação/variação precisa de um respiro extra. */
.topo.rolou { gap: 18px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* cartão de decisão */
.decisao { background: linear-gradient(135deg, #1b2740 0%, #141c2c 70%); border: 1px solid var(--borda); border-radius: 18px; padding: 16px; }
.decisao .razao { font-weight: 600; font-size: 14.5px; }
.decisao .meta { color: var(--suave); font-size: 12px; margin-top: 2px; }
.decisao .linha { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.decisao .preco { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; }
.decisao .var { font-weight: 600; font-size: 14px; }
.decisao .after { font-size: 12px; margin-top: 6px; color: var(--vermelho); }
.badge { display: inline-block; margin-top: 14px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #d7dbe4; color: var(--tinta); }
.badge.COMPRAR { background: #bfecd9; } .badge.CARO { background: #f6d99a; } .badge.VENDER { background: #f6c1c1; }
.decisao .ponto { margin-top: 10px; font-size: 14px; }

.visao-t { font-family: var(--display); font-size: 18px; font-weight: 600; margin: 22px 0 0; }

/* gráfico */
.grafico { position: relative; margin-top: 12px; }
.grafico canvas { display: block; width: 100%; height: 280px; touch-action: pan-y; border-radius: 12px; }
.grafico.grande canvas { height: 440px; }
.grafico .expandir { position: absolute; top: 6px; left: 6px; width: 32px; height: 32px; border-radius: 9px; background: #161e2ecc; display: grid; place-items: center; color: var(--suave); }
.grafico .ia { position: absolute; top: 6px; right: 6px; padding: 6px 11px; border-radius: 999px; background: var(--claro); color: var(--tinta); font-size: 12px; font-weight: 600; }
.grafico .ia b { color: #3b6fd6; margin-right: 4px; }
.aviso { margin-top: 8px; padding: 9px 11px; border-radius: 10px; background: var(--card); border: 1px solid var(--borda); color: var(--suave); font-size: 12.5px; }
.escalas { display: flex; align-items: center; gap: 2px; margin-top: 10px; }
.escalas .e { flex: 1; padding: 7px 0; border-radius: 9px; color: var(--suave); font-size: 13px; font-weight: 500; text-align: center; }
.escalas .e[aria-pressed="true"] { background: var(--claro); color: var(--tinta); font-weight: 700; }
.escalas .vela { flex: none; width: 38px; height: 34px; margin-left: 6px; border-radius: 9px; display: grid; place-items: center; color: var(--suave); border: 1px solid var(--borda); }
.escalas .vela[aria-pressed="true"] { color: var(--texto); border-color: var(--azul); }
.legenda-var { color: var(--suave); font-size: 12px; margin-top: 8px; }
.legenda-var b { font-weight: 600; }
.legenda-zonas { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 10px; }
.legenda-zonas span { display: flex; align-items: center; gap: 5px; color: var(--suave); font-size: 11.5px; }
.legenda-zonas i { width: 8px; height: 8px; border-radius: 2px; flex: none; }

/* seções */
.sec { margin-top: 30px; }
.sec > h2 { font-family: var(--display); font-size: 18px; font-weight: 600; margin: 0 0 10px; text-wrap: balance; }
.sec > h2 small { font-family: var(--corpo); font-weight: 400; color: var(--suave); font-size: 12.5px; margin-left: 6px; }
.sub { color: var(--suave); font-size: 12px; margin: -6px 0 10px; }
.card { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 14px; }
.pilha { display: grid; gap: 8px; }
.rot { color: var(--suave); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
.link { color: var(--azul); font-size: 12.5px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #5b8def66; }
.nota { color: var(--suave); font-size: 12.5px; line-height: 1.5; }
.nota b { color: var(--texto); font-weight: 600; }
.tag-proto { display: inline-block; padding: 1px 7px; border-radius: 999px; border: 1px dashed var(--fraco); color: var(--suave); font-size: 10.5px; letter-spacing: .03em; vertical-align: middle; }

/* linha simples: rótulo à esquerda, valor à direita */
.zona { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--borda);
  border-left: 3px solid var(--c); border-radius: 12px; padding: 13px 14px; }
.zona b { font-size: 15.5px; font-weight: 700; text-align: right; }

/* Selo de Fundamentos (issue #47, item 11): só um fato, nunca recomendação - fica abaixo da
   Faixa inferior, dentro do mesmo cartão (flex-basis 100% força a quebra de linha). */
.selo-fund { flex: 1 0 100%; display: flex; flex-direction: column; gap: 2px; margin-top: 8px; padding: 8px 10px;
  border-radius: 8px; font-size: 12.5px; }
.selo-fund b { font-size: 12.5px; }
.selo-fund span { font-size: 11.5px; opacity: .9; }
.selo-fund-1 { background: #2a2a1f; color: #e3d9a0; }
.selo-fund-2 { background: #40280f; color: #ffbf7a; }
.selo-fund-3 { background: #3a1414; color: #ff9b9b; }
.duas { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.duas .dir { font-size: 17px; font-weight: 700; text-align: right; white-space: nowrap; }
.duas .esq small { display: block; color: var(--suave); font-size: 12px; margin-top: 2px; }

/* régua */
.regua { position: relative; height: 10px; border-radius: 999px; margin: 26px 6px 8px; }
.regua .traco { position: absolute; top: -5px; width: 2px; height: 20px; transform: translateX(-1px); border-radius: 2px; background: var(--texto); }
.regua .bola { position: absolute; top: -4px; width: 18px; height: 18px; transform: translateX(-9px); border-radius: 50%; background: var(--texto);
  border: 3px solid var(--azul); box-shadow: 0 0 0 4px #5b8def33; }
.regua button.bola { cursor: pointer; }
.regua .bola-7d { position: absolute; top: -1px; width: 10px; height: 10px; transform: translateX(-5px); border-radius: 50%; background: var(--card); border: 2px solid var(--suave); }
.regua .aqui { position: absolute; top: -22px; transform: translateX(-50%); font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--azul); white-space: nowrap; }
.regua .balao { position: absolute; top: -30px; transform: translateX(-50%); background: var(--claro); color: var(--tinta); font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.pontas { display: flex; justify-content: space-between; gap: 8px; color: var(--suave); font-size: 12px; }
.pontas.tres span { flex: 1; } .pontas.tres span:nth-child(2) { text-align: center; } .pontas.tres span:nth-child(3) { text-align: right; }
.leg { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--suave); font-size: 12px; margin-top: 10px; }
.leg span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--c); }

/* bloco mín/máx */
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.trio div span { display: block; color: var(--suave); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.trio div b { font-size: 15.5px; }
.trio div:nth-child(2) { text-align: center; } .trio div:nth-child(3) { text-align: right; }
.destaque { margin-top: 10px; font-weight: 600; }
.cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cab strong { font-size: 14.5px; }

/* fundamentos */
details.acord { border: 1px solid var(--borda); border-radius: 14px; background: #121a28; }
details.acord > summary { padding: 13px 14px; font-weight: 600; cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; }
details.acord > summary::-webkit-details-marker { display: none; }
details.acord > summary::before { content: "›"; display: inline-block; color: var(--suave); font-size: 18px; line-height: 1; transition: transform .15s; }
details.acord[open] > summary::before { transform: rotate(90deg); }
details.acord > .dentro { padding: 0 12px 12px; display: grid; gap: 10px; }
.crit .topo-c { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.crit .nome { font-weight: 600; font-size: 15px; }
.st { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.st.bom { background: #2fbf8a26; color: var(--verde); } .st.ruim { background: #f06a6a26; color: var(--vermelho); }
.st.neutro { background: var(--claro); color: var(--tinta); }
.vals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 10px; }
.vals span { display: block; color: var(--suave); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; }
.vals b { font-size: 16px; }
.lista-v { margin: 12px 0 10px; display: grid; gap: 6px; }
.lista-v div { display: flex; justify-content: space-between; gap: 10px; color: var(--suave); font-size: 13px; }
.lista-v b { color: var(--texto); }
.exemplo { background: var(--card2); border-radius: 10px; padding: 10px 12px; font-weight: 600; margin-bottom: 10px; }

/* mini gráfico de barras (item 4, 27/11/2026) - só reaproveita valores já mostrados na tela */
.mini-barras { display: flex; align-items: flex-end; gap: 10px; margin: 10px 0 14px; padding-top: 4px; }
.mini-barra { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; min-width: 0; }
/* mb-val/mb-rot reservam uma altura fixa (pra até 2 linhas) - sem isso, uma coluna com rótulo mais
   longo (ex. "Estimativa jan/26: R$ 4,20" ou "2026E Guidance", quebrando em 2 linhas) ficava mais
   alta que as outras, e como `.mini-barras` alinha as colunas pela base (`align-items: flex-end`),
   isso empurrava o conteúdo da coluna mais alta pra CIMA - as barras ficavam desalinhadas entre si
   (bug reportado pelo usuário com print, 27/11/2026). Com a altura fixa, toda coluna tem a MESMA
   altura total sempre, então as barras ficam sempre na mesma posição, não importa o tamanho do
   rótulo de cima/baixo.
   display:flex + align-items:flex-start faz o rótulo de cima (mb-val) começar sempre na MESMA altura
   em toda coluna (1ª linha de todos os rótulos no mesmo nível, pedido do usuário) - um rótulo de
   2 linhas cresce pra BAIXO, na direção da barra, em vez de subir; o rótulo de baixo (mb-rot) fica
   normal (bloco), o espaço sobra embaixo. */
.mb-val { display: flex; align-items: flex-start; justify-content: center; min-height: 28px; font-size: 11px; color: var(--texto); font-weight: 600; margin-bottom: 4px; white-space: nowrap; line-height: 1.2; }
.mb-col { display: flex; align-items: flex-end; height: 58px; }
.mb-cheia { width: 20px; border-radius: 4px 4px 0 0; background: var(--azul); }
.mb-cheia.proj { background: repeating-linear-gradient(45deg, var(--azul), var(--azul) 3px, transparent 3px, transparent 6px); opacity: .55; border: 1px dashed var(--azul); }
.mb-cheia.neg { background: var(--vermelho); }
.mb-rot { display: block; min-height: 26px; font-size: 10px; line-height: 1.25; color: var(--suave); margin-top: 4px; text-align: center; }
/* barra bicolor da estimativa inicial (item 4, follow-up 27/11/2026): empilhada, Atual (azul)
   embaixo + Perdido (vermelho hachurado) em cima - mesma escala das outras barras do gráfico. Coluna
   um pouco mais larga (mini-barra-larga) pra caber os 2 rótulos dentro dos segmentos. */
.mini-barra-larga { flex: 1.7 1 0; }
/* rótulo "Estimativa jan/26: R$ 4,20" é mais longo que os outros (ex. "R$ 5,23") e, com
   white-space:nowrap do .mb-val padrão, vazava por cima da coluna vizinha (bug reportado pelo
   usuário com print, 27/11/2026) - aqui quebra linha e fica centralizado (o "4,20" da 2ª linha
   centralizado embaixo do "Estimativa jan/26: R$" da 1ª, a pedido do usuário) dentro da coluna. */
.mini-barra-larga .mb-val { white-space: normal; justify-content: center; font-size: 10px; }
.mb-stack { display: flex; flex-direction: column; width: 34px; border-radius: 4px 4px 0 0; overflow: hidden; }
.mb-seg { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; overflow: hidden; }
.mb-seg-real { background: var(--azul); }
.mb-seg-perdido { background: repeating-linear-gradient(45deg, var(--vermelho), var(--vermelho) 3px, transparent 3px, transparent 6px); border-bottom: 1px solid var(--vermelho); }
.mb-seg-l1 { font-size: 6px; color: #fff; opacity: .85; }
.mb-seg-l2 { font-size: 7.5px; color: #fff; font-weight: 700; margin-top: 1px; }
.crit p { margin: 0 0 10px; color: var(--suave); font-size: 13px; line-height: 1.5; }

/* indicadores */
.grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ind { text-align: left; background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 13px 14px; min-width: 0; }
.ind .v { display: block; font-size: 21px; font-weight: 700; margin: 5px 0 3px; overflow-wrap: anywhere; }
.ind .s { display: block; color: var(--suave); font-size: 12px; }
.ind .dica { display: none; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--borda); color: var(--texto); font-size: 12.5px; line-height: 1.45; }
.ind[aria-expanded="true"] { border-color: var(--azul); } .ind[aria-expanded="true"] .dica { display: block; }

/* retorno */
.toggle { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--borda); border-radius: 999px; padding: 4px; }
.toggle button { flex: 1; padding: 9px 4px; border-radius: 999px; color: var(--suave); font-size: 11.5px; white-space: nowrap; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.toggle button::after { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid currentColor; flex: none; }
.toggle button[aria-pressed="true"] { background: var(--claro); color: var(--tinta); }
.toggle button[aria-pressed="true"]::after { background: var(--verde); border-color: var(--verde); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; margin-top: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--borda); color: var(--suave); font-size: 12.5px; font-weight: 600; }
.chips button[aria-pressed="true"] { background: var(--claro); color: var(--tinta); border-color: var(--claro); }
.barras { position: relative; height: 230px; margin: 16px 0 0 44px; }
.barras .grade-y { position: absolute; inset: 0 0 24px 0; }
.barras .grade-y div { position: absolute; left: 0; right: 0; border-top: 1px solid #26314799; }
.barras .grade-y span { position: absolute; left: -44px; width: 38px; text-align: right; transform: translateY(-50%); color: var(--suave); font-size: 11px; }
.barras .cols { position: absolute; inset: 0 0 24px 0; display: flex; }
.barras .col { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 6px; position: relative; }
.barras .b { width: 34%; max-width: 46px; min-height: 3px; border-radius: 5px 5px 0 0; position: relative; transition: height .45s cubic-bezier(.2,.8,.2,1); }
.barras .b.acao { background: var(--verde); } .barras .b.idx { background: var(--ardosia); }
.barras .b i { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11.5px; font-weight: 600; white-space: nowrap; padding-bottom: 3px; }
.barras .b.idx i { color: var(--suave); font-weight: 500; }
.barras .col em { position: absolute; top: 100%; font-style: normal; color: var(--suave); font-size: 12px; padding-top: 5px; }
.resumo > div { padding: 12px 0; border-bottom: 1px solid #26314799; font-size: 13px; line-height: 1.55; color: var(--suave); }
.resumo > div:first-child { padding-top: 0; } .resumo > div:last-child { border-bottom: 0; padding-bottom: 0; }
.resumo b { color: var(--texto); font-weight: 600; } .resumo .dif { color: var(--verde); font-weight: 700; }
.resumo .dif.neg { color: var(--vermelho); }
.q { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--suave); color: var(--suave); font-size: 11px; font-weight: 700; margin-left: 4px; vertical-align: 1px; }
.dica-q { display: block; margin-top: 6px; padding: 8px 10px; border-radius: 9px; background: var(--card2); color: var(--texto); font-size: 12.5px; }

/* backtest */
.selo { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.selo.ok { background: #15402f; color: #7ee2b8; } .selo.nao { background: #4a2020; color: #ffaaaa; }

  const ult = p.length - 1;
  if (p[ult] > 100 - folgaDir - g[ult]) p[ult] = 100 - folgaDir - g[ult];

     sem selo "Favorável"/"Desfavorável" (isso é só o Selo de Fundamentos do item 11, lá na Faixa

     CONTÁBIL TTM; ajustado só como [Ajustado] extra, nunca no cálculo principal. Linha sem dado

  (function Fundamentals(el) {
    const prejuizo = tem(d.lpa) && d.lpa <= 0;
    // LPA ajustado: só informativo, nunca no cálculo (REGRA TRAVADA)
    const lpaAjustado = d.baseLpa === 'últimos 4 trimestres' && tem(d.lpa) && d.lpa > 0 && tem(d.lpaAgora) && d.lpaAgora > 0
      && Math.abs(d.lpaAgora / d.lpa - 1) > 0.10 ? d.lpaAgora : null;
    const plAjustado = tem(lpaAjustado) ? d.preco / lpaAjustado : null;
    // Visão do ano: início do ano (guidance congelado) | contábil 12 meses | previsão atual (guidance ou consenso)
    const Fp = d.consensoAno || {}, G0 = d.guidance, GI = d.guidanceInicial || {};
    const anoPrev = (G0 && G0.periodo) || (d.lpaAnos && d.lpaAnos.length ? d.lpaAnos[d.lpaAnos.length - 1].ano + 1 : null);
    const lpaCons = tem(Fp.lpa) && Fp.lpa > 0 ? Fp.lpa : null;
    const lpaGuia = G0 && tem(G0.lpa) && G0.lpa > 0 ? G0.lpa : null;
    const lpaPrev = lpaGuia || lpaCons;
    const plPrev = tem(lpaPrev) ? d.preco / lpaPrev : null;
    const lpaIni = tem(GI.lpa) && GI.lpa > 0 ? GI.lpa : null;

      return d.lpaFonte ? `Fonte: ${d.lpaFonte}` : ''; })();

    // HIERARQUIA DO LPA (27/11/2026, a pedido do usuário): TTM é o único LPA que entra no cálculo
    // de P/L (REGRA TRAVADA acima) - os outros 3 valores (início do ano, previsão atual, ajustado)
    // são só referência/contexto, nunca o LPA usado. Por isso TTM fica em destaque na própria linha
    // do cálculo (acima), e os outros 3 viram 1 única linha pequena/cinza, sem o peso visual de
    // linhas separadas em negrito - "Início do ano" é o guidance CONGELADO no começo do ano fiscal
    // (não muda); "Contábil 12 meses (TTM)" acima é o que realmente atualiza a cada balanço.
    const contexto = [
      lpaIni ? `Início do ano ${din(lpaIni)}${GI.ano ? ` (${GI.ano})` : ''}` : null,
      tem(lpaPrev) ? `Previsão atual${anoPrev ? ` (${anoPrev})` : ''} ${din(lpaPrev)}${lpaGuia ? ' · guidance' : lpaCons ? ' · consenso' : ''}` : null,
    ].filter(Boolean);
    const linhasMedias = [
      tem(d.lpaMedio3a) ? `3 anos ${din(d.lpaMedio3a)}` : null,

    // Dividendos (item 14, unificado 27/11/2026): ANTES o mesmo dividendo aparecia em 3 lugares

    const DF = d.dadosFixos, temDF = DF && DF.status === 'ok';
    const cortou = tem(d.dividendo12Atras) && d.dividendo12Atras > 0 && d.dividendo < d.dividendo12Atras * 0.95;
    const linhasDiv = [
      tem(d.dividendo) ? ['Pago (365 dias)', din(d.dividendo)] : null,
      temDF && tem(DF.dividendo12m) ? ['Declarado (CVM)', din(DF.dividendo12m)] : null,
      d.guidance && tem(d.guidance.dividendo) ? [`Projetado${anoPrev ? ` ${anoPrev}` : ''}`, `${din(d.guidance.dividendo)} · DY ${f(d.guidance.dividendo / d.preco * 100, 1)}%`] : null,

    const fraseDiv = !tem(dy) ? ''
      : naoPagadora ? (d.dividendo > 0 ? `A ${d.ticker} quase não paga dividendo; reinveste quase todo o lucro na própria empresa. É o perfil da empresa, para quem busca crescimento, não renda.`

      : cortou ? `Dividendo reduzido vs 12 meses atrás: de ${din(d.dividendo12Atras)} para ${din(d.dividendo)} por ação.` : '';
    // UMA única nota explicando os 3 métodos do dividendo (antes repetida, com texto diferente,

    const notaDiv = 'Pago = dinheiro que caiu na sua conta nos últimos 365 dias corridos (Yahoo Finance). '

      + ' Pago e declarado quase nunca batem exatamente - são 2 datas diferentes (pagamento x aprovação), não um erro.';

    el.innerHTML = `<h2>Lucro e Preço vs Lucro</h2>
      <div class="pilha">
        <div class="card">
          ${bolaAtualizacao(d.atualizacao)}
          ${prejuizo ? `<div class="destaque" style="color:var(--vermelho)">A empresa teve prejuízo nos últimos 12 meses: a relação preço/lucro não se aplica.</div>` : !tem(d.pl) ? `<div class="nota">${INDISP}</div>` : `
          <div class="duas"><span class="rot">Cotação ÷ LPA contábil TTM = P/L</span></div>
          <div class="nota num" style="margin-top:2px;font-size:15px">${f(d.preco)} ÷ <b style="color:var(--texto);font-size:17px">${f(d.lpa)}</b> = <b style="color:var(--texto);font-size:17px">P/L ${f(d.pl)}</b></div>
          ${contexto.length || tem(lpaAjustado) ? `<div class="nota" style="margin-top:6px;opacity:.85">${[...contexto, tem(lpaAjustado) ? `[Ajustado] ${din(lpaAjustado)}${tem(plAjustado) ? ` · P/L ${f(plAjustado)}` : ''}` : null].filter(Boolean).join(' · ')}</div>` : ''}
          ${linhasMedias.length ? `<div class="nota num" style="margin-top:8px">Média: ${linhasMedias.join(' • ')}</div>` : ''}
          ${tem(d.plMedio12) ? `<div class="nota num" style="margin-top:4px">P/L médio 12m: ${f(d.plMedio12)}${tem(d.pl) ? ` (vs. P/L atual ${f(d.pl)})` : ''}</div>` : ''}
          `}
          ${fonteLinha ? `<div class="nota" style="margin-top:10px">${fonteLinha}</div>` : ''}
        </div>

          <strong>Dividendos</strong>
          ${linhasDiv.length ? `<div class="lista-v num" style="margin-top:8px">${linhasDiv.map(([r, v]) => `<div>${r}<b>${v}</b></div>`).join('')}</div>` : `<div class="nota" style="margin-top:8px">${INDISP}</div>`}
          ${linhasDiv.length ? `<div class="nota" style="margin-top:6px">${notaDiv}</div>` : ''}
          ${fraseDiv ? `<p class="nota" style="margin-top:8px">${fraseDiv}</p>` : ''}

  /* ---------------- indicadores */
  (function Indicators(el) {
    const difPL = tem(d.pl) && tem(d.plMedio12) && d.plMedio12 > 0 ? (d.pl / d.plMedio12 - 1) * 100 : null;
    const q = qtd(d.acoes);

    // Campos que só existiam no bloco "Dados fixos" (removido, unificação de 27/11/2026) -

    const c = (rot, v, sub, dica) => [rot, v, sub, dica];
    const cartoes = [
      c('P/L atual', tem(d.pl) ? f(d.pl) : null, tem(difPL) ? `${sinal(difPL)} vs. média de 12m` : '', `Você paga ${din(d.pl)} para cada ${d.moeda} 1 de lucro. Conta: ${f(d.preco)} / ${f(d.lpa)} = ${f(d.pl)}`),
      c('P/L médio 12 meses', tem(d.plMedio12) ? f(d.plMedio12) : null, medioSub, d.plMetodo === 'simplificado' ? 'Estimativa: preço médio do ano dividido pelo LPA atual, porque o Yahoo não traz o lucro de cada trimestre.' : d.plMetodo === 'contabil' ? `Média do P/L de cada pregão desde ${d.mediaDesde}, com o lucro contábil em vigor em cada data.` : 'Média do P/L de cada pregão do último ano, com o lucro já divulgado em cada data.'),
      c('LPA básico', tem(d.lpa) ? din(d.lpa) : null, 'últimos 12 meses', `Lucro por ação. Cada ação ganhou ${din(d.lpa)} em 12 meses.${q ? ` Conta: Lucro / ${q} de ações` : ''}`),
      // Dividendo anual (pago/declarado/projetado) unificado no card "Dividendos" (bloco "Lucro e
      // Preço vs Lucro" acima, 27/11/2026) - aqui só o Dividend Yield, uma conta diferente (não

      c('Dividend yield', tem(dy) ? `${f(dy)}%` : null, tem(dy) ? `${f(d.dividendo)} / ${f(d.preco)}` : '', `Quanto o dividendo representa sobre o preço. ${f(d.dividendo)} / ${f(d.preco)} = ${f(dy)}%.${naoPagadora ? ` É baixo porque a ${d.ticker} reinveste o lucro, não porque está com problema.` : ''}`),
      c('Ações em circulação', q, 'quantos pedaços a empresa foi dividida', `A ${d.ticker} foi fatiada em ${q} de ações.${temDF ? ` Fonte: ${fonteDF}` : ''}`),
      c('Lucro líquido (12 meses)', temDF && tem(DF.lucro12m) ? `${f(DF.lucro12m / 1e9, 2)} bi` : null, 'declarado na CVM', `Lucro líquido total da empresa nos últimos 4 trimestres declarados na CVM. Fonte: ${fonteDF}`),
    ];
    // P/VP, Payout, ROE (Issue #35) - só existiam no bloco "Dados fixos" removido; reusam o
    // MESMO cálculo já feito em utils.dados_fixos.calcular_indicadores (d.dadosFixos.pvp/payout/
    // roe), nenhuma conta nova aqui. Ao contrário dos cartões acima, um card sem dado aqui SOME
    // (não mostra "Dados indisponíveis") - são indicadores extra, opcionais, não o núcleo da tela.
    const cartoesExtra = [
      temDF && tem(DF.pvp) ? c('P/VP', f(DF.pvp, 2), 'Preço / Valor Patrimonial por Ação',
        `P/VP = Preço ÷ VPA.${tem(DF.vpa) ? ` Conta: ${f(d.preco)} ÷ ${f(DF.vpa, 2)} = ${f(DF.pvp, 2)}.` : ''} Fonte: ${fonteDF}`) : null,
      temDF && tem(DF.payout) ? c('Payout', `${f(DF.payout * 100, 1)}%`, 'dividendo declarado ÷ LPA',
        `Payout = Dividendo declarado na CVM ÷ LPA.${tem(DF.dividendo12m) && tem(d.lpa) ? ` Conta: ${din(DF.dividendo12m)} ÷ ${din(d.lpa)} = ${f(DF.payout * 100, 1)}%.` : ''} Fonte: ${fonteDF}`) : null,
      temDF && tem(DF.roe) ? c('ROE', `${f(DF.roe * 100, 1)}%`, 'lucro líquido ÷ patrimônio líquido',
        `ROE = Lucro líquido (12 meses) ÷ Patrimônio líquido.${tem(DF.lucro12m) && tem(DF.patrimonioLiquido) ? ` Conta: ${f(DF.lucro12m / 1e9, 2)} bi ÷ ${f(DF.patrimonioLiquido / 1e9, 2)} bi = ${f(DF.roe * 100, 1)}%.` : ''} Fonte: ${fonteDF}`) : null,
    ].filter(Boolean);
    const todosCartoes = [...cartoes, ...cartoesExtra];
    el.innerHTML = `<h2>Indicadores</h2>
      <div class="sub">Dados de ${d.data} · Fonte: ${d.fonte} · <button class="link" data-folha="ind">Ver como calculamos</button></div>

      <div class="grade2">${todosCartoes.map(([r, v, s, dica]) => v === null
        ? `<div class="ind"><span class="rot">${r}</span><span class="s" style="margin-top:8px">${INDISP}</span></div>`
        : `<button class="ind" aria-expanded="false"><span class="rot">${r}</span><span class="v num">${v}</span><span class="s num">${s}</span><span class="dica">${dica}</span></button>`).join('')}</div>`;

    }; });
    FOLHAS.ind = () => ['Como calculamos os indicadores', `
      <p><b>P/L atual</b></p>${tem(d.pl) ? `<code>${f(d.preco)} ÷ ${f(d.lpa)} = ${f(d.pl)}</code>` : `<p>${INDISP}.</p>`}
      <p><b>Dividend yield</b></p>${tem(dy) ? `<code>${f(d.dividendo)} ÷ ${f(d.preco)} = ${f(dy)}%</code>` : `<p>${INDISP}.</p>`}
      <p><b>LPA básico:</b> lucro líquido dos últimos 12 meses dividido pelo número de ações.</p>

      <p>Toque em um cartão para ver a explicação dele.</p>${fonte}`];
  })($('indicadores'));

  /* ---------------- retorno acumulado (issue #47, item 16): nunca mistura moeda - d.comparadores
     já vem filtrado (BR só R$: Ibovespa/IPCA/Poupança; EUA só US$: S&P 500/Nasdaq - ver
     app.comparadores). CDI/Selic (BR) saem para o card "Renda fixa", separado, com a etiqueta
     [Outro tipo de investimento]. Sem simulação de R$/US$ 10.000: só % e diferença em pontos. */
  (function TotalReturn(el) {
    const idx = d.retorno.periodos.map((_, i) => i).filter(i => tem(d.retorno.total[i]));
    if (!idx.length) { el.innerHTML = `<h2>Retorno acumulado</h2><div class="card nota">Histórico curto demais para calcular retornos.</div>`; return; }
    const comDado = k => d.comparadores[k] && d.comparadores[k].v.some(tem);
    // abre no comparador da bolsa da ação; se ele não tiver dado, no primeiro que tiver
    let reinveste = true, dicaAberta = false, per = idx[0],
      comp = comDado(d.comparadorPadrao) ? d.comparadorPadrao : (Object.keys(d.comparadores).find(comDado) || Object.keys(d.comparadores)[0]);
    function render() {
      const c = d.comparadores[comp];
      const vals = reinveste ? d.retorno.total : d.retorno.preco;
      const pSel = d.retorno.periodos[per];
      const difP = tem(d.retorno.preco[per]) && tem(d.retorno.total[per]) ? d.retorno.total[per] - d.retorno.preco[per] : null;
      const recebido = per === 0 ? d.dividendo : per === 2 ? d.dividendos5Anos : null;
      let texto;
      if (reinveste) texto = !tem(difP) ? 'Retorno com os dividendos reinvestidos em mais ações.'
        : difP < 1 ? `Quase nenhuma diferença em ${pSel}. Reinvestir ou não muda ${f(Math.max(difP, 0), 1)} ponto no seu retorno.`
        : `${difP >= 10 ? 'Grande diferença' : 'Faz diferença'}. Em ${pSel}, reinvestir os dividendos faz seu retorno ir de ${ret(d.retorno.preco[per])} para ${ret(d.retorno.total[per])}, porque você compra mais ações com o dividendo.`;
      else texto = (tem(recebido) && recebido > 0 ? `Você recebeu ${din(recebido)} por ação em dividendos em ${pSel}, em dinheiro, e não recomprou.` : `Você recebeu os dividendos de ${pSel} em dinheiro e não recomprou.`)
        + (tem(difP) && difP >= 10 ? ` Deixou de ganhar ${f(difP, 1)} pontos do efeito bola de neve.` : '');

      // a ação primeiro; depois os comparadores (mesma moeda) do menor para o maior retorno
      const linhasG = [{ nome: d.ticker, v: vals[per], acao: true },
        ...Object.values(d.comparadores).map(o => ({ nome: o.nome, v: o.v[per] }))
          .sort((x, y) => (tem(x.v) ? x.v : Infinity) - (tem(y.v) ? y.v : Infinity))];
      const comV = linhasG.map(l => l.v).filter(tem);
      let vhi = Math.max(0, ...comV), vlo = Math.min(0, ...comV);
      const vpasso = passoBonito(Math.max(vhi - vlo, 1) / 4);
      vhi = Math.max(vpasso, Math.ceil(vhi / vpasso) * vpasso); vlo = Math.floor(vlo / vpasso) * vpasso;
      const vamp = vhi - vlo, vpos = v => (v - vlo) / vamp * 100;
      const vmarcas = []; for (let v = vlo; v <= vhi + 1e-9; v += vpasso) vmarcas.push(v);
      const grafico = `<div class="grade-y">${vmarcas.map(v => `<div style="bottom:${vpos(v)}%"><span>${f(v, 0)}%</span></div>`).join('')}<div class="zero" style="bottom:${vpos(0)}%"></div></div>
        <div class="vcols">${linhasG.map(l => `<div class="vc${l.acao ? ' acao' : ''}">${tem(l.v)
          ? `<div class="vb${l.v < 0 ? ' neg' : ''}" style="bottom:${vpos(Math.min(0, l.v))}%;height:${Math.max(Math.abs(l.v) / vamp * 100, 0.8)}%"><i class="num">${ret(l.v)}</i></div>`
          : `<div class="vb vazio" style="bottom:${vpos(0)}%" title="Sem dado"><i>—</i></div>`}
          <em>${({ 'S&P 500': 'S&P', 'S&P 500 (sem dividendos)': 'S&P s/div', 'Ibovespa': 'Ibov', 'Poupança': 'Poup.' })[l.nome] || l.nome}</em></div>`).join('')}</div>`;

      // resumo do período contra o comparador da bolsa: só % e diferença em pontos (sem simulação de dinheiro)
      const p = d.retorno.periodos[per];
      let resumo;
      if (!tem(vals[per])) resumo = `<div><b>Retorno acumulado: ${INDISP} em ${p}</b></div>`;
      else {
        const cab = `<b>${d.ticker}: ${ret(vals[per])} em ${p}</b>${reinveste ? '' : ' (só preço)'}`;
        if (!tem(c.v[per])) resumo = `<div>${cab}<br>${c.nome}: ${INDISP}</div>`;
        else {
          const dif = vals[per] - c.v[per], casas = Math.abs(dif) >= 100 ? 0 : 1;
          resumo = `<div>${cab}<br>
          ${c.nome}: ${ret(c.v[per])} | Diferença: <span class="dif ${dif < 0 ? 'neg' : ''}">${dif >= 0 ? '+' : '-'}${f(Math.abs(dif), casas)} pontos ${dif >= 0 ? 'acima' : 'abaixo'} ${c.artigo}</span><button class="q" id="qpp" aria-label="O que são pontos percentuais?">?</button>
          ${dicaAberta ? `<span class="dica-q">p.p. = pontos percentuais. É só a conta: ${f(vals[per], 1)}% - ${f(c.v[per], 1)}% = ${f(Math.abs(dif), casas)} pontos. Não é ${f(Math.abs(dif), casas)}%.</span>` : ''}</div>`;
        }
      }

      const t3 = d.retorno.total[1], t5 = d.retorno.total[2];
      const porque = per === 2 && tem(t3) && tem(t5) && t3 > t5
        ? `Por que 3 anos (${ret(t3)}) rendeu mais que 5 anos (${ret(t5)})? Porque entre 5 e 3 anos atrás a ação caiu ${f(Math.abs(((1 + t5 / 100) / (1 + t3 / 100) - 1) * 100), 0)}%. O ganho veio todo nos últimos 3 anos. ` : '';
      // Renda fixa (BR): CDI/Selic, separado do gráfico de índices - é outro tipo de investimento
      const rendaFixaHtml = (() => {
        const tx = Object.values(d.rendaFixa || {}).filter(o => tem(o.taxaAno) || (o.v && o.v.some(tem)));

  /* ---------------- backtest: SEÇÃO REMOVIDA (issue #47, item 13). "Os sinais funcionaram no

  /* ---------------- bloco de cada modo */
  function renderBloco() {

        ${proximoOT}

    if (modo === 'graham') {
      const rg = d.regra, anos = d.lpaAnos;
      const destaque = rg.status === 'ok' ? `Média de ${anos.length} ${anos.length === 1 ? 'ano' : 'anos'}: ${din(rg.media)}`
        : rg.status === 'excluido' ? 'Ano de prejuízo excluído' : rg.status === 'recorrente' ? rg.mensagem : INDISP;
      const fonteAnual = d.lpaAnualFonte ? `Histórico de lucro por ação verificado na fonte oficial: ${d.lpaAnualFonte}. `

      const nota = fonteAnual + (rg.status === 'excluido' ? `Média dos anos com lucro: ${din(rg.media)}.`

        : rg.status === 'ok' ? 'Sem prejuízo nos últimos 3 anos.' : 'O Yahoo Finance não traz o lucro anual deste ativo.');
      // projeção: LPA estimado pelos analistas para o ano fiscal em curso (o seguinte ao último divulgado)
      const proj = d.lynch && d.lynch.futuro ? d.lynch.futuro.lpaEsteAno : null;
      // com guidance cadastrado, o período vem da empresa (ex.: FY2027); senão, o ano seguinte ao último divulgado
      const anoProj = d.guidance && d.guidance.periodo ? d.guidance.periodo : anos.length ? anos[anos.length - 1].ano + 1 : null;
      const ultimo = anos.length ? anos[anos.length - 1].lpa : null;
      const varProj = tem(proj) && tem(ultimo) && ultimo > 0 ? (proj / ultimo - 1) * 100 : null;
      const Fu = d.lynch && d.lynch.futuro ? d.lynch.futuro : {};
      const G = d.guidance;
      const consenso = !tem(proj) ? '' : G ? (G.porLpa ? `Guidance oficial da empresa (${G.fonte}, ${G.data}): ${G.lucroTipo}${G.periodo ? ` ${G.periodo}` : ''} de ${din(G.lpaMin)} a ${din(G.lpaMax)}, ponto médio ${din(G.lpa)}`

      const GIb = d.guidanceInicial || {};
