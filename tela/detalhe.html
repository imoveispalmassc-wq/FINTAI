<div class="app">
  <header class="topo">
    <div class="meio">
      <div class="nome" id="t-nome"></div>
      <div class="bolsa" id="t-bolsa"></div>
    </div>
    <div class="preco-topo num" id="t-preco"></div>
    <div class="ticker-topo" id="t-ticker"></div>
  </header>
  <div class="modo-linha">
    <h2 class="visao-t">Visão geral</h2>
    <div class="modos" role="group" aria-label="Modo de análise">
      <button data-modo="graham" aria-pressed="true">CONSERVADOR</button>
      <button data-modo="lynch" aria-pressed="false">CRESCIMENTO</button>
      <button data-modo="simons" aria-pressed="false">QUANTITATIVO</button>
    </div>
  </div>
  <section id="grafico"></section>
  <section id="decisao"></section>
  <main id="visao">
    <section class="sec" id="faixa"></section>
    <section class="sec" id="tendencia"></section>
    <section class="sec" id="minmax"></section>
    <section class="sec" id="modo-bloco"></section>
    <section class="sec" id="fundamentos"></section>
    <section class="sec" id="dados-fixos"></section>
    <section class="sec" id="indicadores"></section>
    <section class="sec" id="retorno"></section>
  </main>
  <p class="fonte-rodape">Fonte: Yahoo Finance. Dados podem mudar após balanço.</p>
  <div class="fundo" id="fundo" hidden><div class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-t">
    <div class="cab"><h3 id="folha-t"></h3><button class="x" id="folha-x" aria-label="Fechar">×</button></div>
    <div id="folha-c"></div>
  </div></div>
</div>
