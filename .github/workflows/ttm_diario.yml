name: TTM diário (catch-up automático)

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 07:00 Brasília, todos os dias
  workflow_dispatch:
    inputs:
      hoje:
        description: "Forçar data de hoje (YYYY-MM-DD) — opcional, para reprocessar"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ttm-diario
  cancel-in-progress: false

jobs:
  ttm:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependências
        run: pip install -r requirements.txt pytest || pip install requests numpy pandas yfinance pytest

      # REGRA 6 (travada): pytest antes de qualquer PR
      - name: Testes (python -m pytest)
        run: python -m pytest -q

      # Se este passo falhar, os passos seguintes não rodam:
      # last_run.json NÃO é atualizado e o próximo dia reprocessa os dias perdidos.
      - name: Calcular TTM
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          FINTAI_HOJE: ${{ github.event.inputs.hoje }}
        run: python utils/ttm_auto.py

      # REGRA 6 (travada): atualização automática NUNCA vai direto para a main - sempre PR para revisão
      # (sempre o mesmo ramo, recriado a partir da main a cada execução: o PR aberto é atualizado, não duplicado)
      - name: Abrir/atualizar pull request do TTM
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arquivos="utils/ttm_diario.json utils/last_run.json"
          if git diff --quiet -- $arquivos; then
            echo "Sem mudanças no TTM."
            exit 0
          fi
          git fetch origin main
          python tools/resumo_ttm_pr.py --base origin/main --saida /tmp/pr_ttm.md
          mkdir -p /tmp/ttm && cp $arquivos /tmp/ttm/
          git config user.name  "fintai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          ramo="ttm/revisar"
          git checkout -B "$ramo" origin/main
          cp /tmp/ttm/ttm_diario.json /tmp/ttm/last_run.json utils/
          git add $arquivos
          git commit -m "Atualização automática TTM - $(date -u +%d/%m/%Y) [revisar]"
          git push --force origin "$ramo"
          gh pr create --base main --head "$ramo" \
            --title "TTM automático: revisar ($(date -u +%d/%m/%Y))" --body-file /tmp/pr_ttm.md \
            || gh pr edit "$ramo" --body-file /tmp/pr_ttm.md
