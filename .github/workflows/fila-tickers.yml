name: Processar fila pública de tickers novos

# Usuários do app pedem tickers que ainda não estão em utils/guidance_tickers.json; o app registra
# o pedido como uma Issue "Fila: TICKER" (label fila-ticker), porque o app não tem permissão de
# gravar no repositório. Este workflow lê essas Issues, valida o guidance com as mesmas travas do
# AUTOMÁTICO COM PROTEÇÃO e fecha cada Issue com o resultado. Roda 4x por dia para esvaziar a fila
# aos poucos mesmo em dias de pico, sem precisar de cadastro manual.

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (4x por dia)
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  issues: write

concurrency:
  group: fila-tickers
  cancel-in-progress: false

jobs:
  fila:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do robô
        run: pip install -r requirements-guidance.txt

      - name: Processar a fila (valida ou trava, sem inventar número)
        env:
          GITHUB_QUEUE_TOKEN: ${{ secrets.GITHUB_QUEUE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python -m utils.fetch_guidance fila

      - name: Gravar o resultado
        run: |
          if ! git diff --quiet -- utils/guidance_tickers.json utils/queue_nao_validado.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add utils/guidance_tickers.json utils/queue_nao_validado.json
            git commit -m "Fila de tickers: validados e travados ($(date -u +'%d/%m/%Y %H:%M') UTC)"
            git push origin HEAD:main
          else
            echo "Fila vazia ou nada resolvido nesta execução."
          fi
