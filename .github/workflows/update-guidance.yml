name: Atualizar guidance oficial

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia às 8h de Brasília (11h UTC; Brasília não tem horário de verão)
  workflow_dispatch: {}    # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pull-requests: write
  issues: write            # aviso "Guidance publicado" depois de publicar sozinho

concurrency:
  group: update-guidance
  cancel-in-progress: false

jobs:
  guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do robô
        run: pip install -r requirements-guidance.txt

      # documentos já tentados sem confiança: evita chamar a API do Claude todo dia no mesmo documento
      - uses: actions/cache@v4
        with:
          path: .guidance_cache
          key: guidance-vistos-${{ github.run_id }}
          restore-keys: guidance-vistos-

      - name: Buscar guidance (CVM e SEC)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # e-mail de contato exigido pela SEC no User-Agent; só no Secret, nunca no código
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python -m utils.fetch_guidance planejar --saida plano.json

      # Guidance TRIMESTRAL (receita, margem, LPA do próximo trimestre) - só informativo, não passa
      # pelas 4 travas (não é a projeção anual que vira "Previsão atual"/P/L)
      - name: Buscar outlook trimestral (EUA)
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python -m utils.fetch_guidance outlook-trimestral

      # AUTOMÁTICO COM PROTEÇÃO: só publica sozinho o que passou nas 4 travas, e avisa depois
      - name: Publicar o que passou nas 4 travas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m utils.fetch_guidance aplicar plano.json --tipo commit --aviso publicado.md
          arquivos="utils/guidance_auto.json utils/guidance_inicial.json utils/contabil_sec.json utils/contabil_br.json utils/guidance_log.json utils/guidance_trimestral_eua.json"
          if ! git diff --quiet -- $arquivos; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $arquivos
            git commit -m "Guidance oficial atualizado automaticamente (CVM/SEC)"
            # o job pode levar minutos; busca o que entrou no main nesse tempo antes de empurrar
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Nada passou nas 4 travas hoje."
          fi
          if [ -f publicado.md ]; then
            gh issue create --title "Guidance publicado sozinho ($(date -u +%d/%m/%Y))" --body-file publicado.md
          fi

      # travou em alguma trava (ou ficou dúvida): não grava no app, abre PR explicando e espera sua decisão
      - name: Abrir pull request com o que travou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m utils.fetch_guidance aplicar plano.json --tipo pr --resumo pr.md
          if ! git diff --quiet -- utils/guidance_auto.json; then
            ramo="guidance/revisar"   # sempre o mesmo ramo: atualiza o PR aberto em vez de abrir outro
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$ramo"
            git add utils/guidance_auto.json
            git commit -m "Guidance travado para revisar ($(date -u +%d/%m/%Y))"
            git push --force origin "$ramo"
            gh pr create --base main --head "$ramo" \
              --title "Guidance travado: precisa da sua decisão ($(date -u +%d/%m/%Y))" --body-file pr.md \
              || gh pr edit "$ramo" --body-file pr.md
          else
            echo "Nada novo travado."
          fi
